<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vector · Memories</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--panel2:#1c232d;--line:#273040;--ink:#e6edf3;--dim:#8b97a7;--faint:#5b6775;
    --accent:#4dd0c0;--warm:#ffb454;--rose:#ff6b8a;--good:#5fd38d;--cool:#6aa6ff;--violet:#b48cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;padding:20px;max-width:2600px;margin:0 auto}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  h1{font-size:20px;margin:0}
  .top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .sub{color:var(--dim);font-size:12px}
  .controls{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px;margin-bottom:14px;position:sticky;top:0;z-index:2}
  input[type=search]{background:#0b0f14;border:1px solid var(--line);border-radius:10px;color:var(--ink);
    padding:8px 12px;font:inherit;width:100%}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chips .lbl{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin-right:4px}
  .chip{font-size:12px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:999px;
    padding:2px 10px;cursor:pointer;user-select:none}
  .chip.on{color:#0e1116;background:var(--accent);border-color:var(--accent)}
  .list{display:flex;flex-direction:column;gap:8px}
  .mem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;
    display:grid;grid-template-columns:28px 1fr;gap:4px 10px}
  .mem.new{animation:glow 2s ease-out}
  @keyframes glow{from{border-color:var(--accent)}to{border-color:var(--line)}}
  .ic{font-size:17px;line-height:1.6;text-align:center}
  .tx{color:#e9eef3}
  .mem.dream .tx{color:#d9ccff;font-style:italic}
  .mem.reflection .tx{color:#a8d8c8}
  .mem.observation .tx{color:var(--dim)}
  .meta{grid-column:2;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--faint);font-size:11.5px}
  .imp{display:inline-flex;gap:2px;vertical-align:middle}
  .imp i{width:5px;height:9px;border-radius:2px;background:#273040}
  .imp i.f{background:var(--warm)}
  .who{color:var(--dim);background:var(--panel2);border-radius:6px;padding:0 6px}
  .tag{border:1px solid var(--line);border-radius:6px;padding:0 6px}
  .tag.pending{color:var(--warm);border-color:#5a3f17}
  .tag.fade{color:var(--faint)}
  .empty{color:var(--faint);text-align:center;padding:30px}
  ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
</style>
</head>
<body>
<div class="top">
  <a href="/">← his mind</a>
  <h1>His memories</h1>
  <span class="sub" id="counts"></span>
</div>
<div class="controls">
  <input type="search" id="q" placeholder="search his memories…">
  <div class="chips" id="kinds"><span class="lbl">kind</span></div>
  <div class="chips" id="people"><span class="lbl">about</span></div>
  <div class="chips" id="sort"><span class="lbl">sort</span></div>
</div>
<div class="list" id="list"></div>

<script>
const KINDS={episode:['🎞','moments'],reflection:['💡','insights'],dream:['💤','dreams'],observation:['👁','passing (2 days)'],
  fact:['📌','facts'],'self-care':['🔋','self-care']};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let mems=[], lastReflected=0, seen=new Set(), first=true;
const state={kind:'all', person:'all', sort:'new', q:''};

function when(t){const d=new Date(t*1000), now=Date.now()/1000, s=now-t;
  const rel=s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' h ago':Math.round(s/86400)+' days ago';
  return `${d.toLocaleDateString([],{month:'short',day:'numeric'})} ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · ${rel}`;}
function chip(group,val,label){const c=document.createElement('span');c.className='chip'+(state[group]===val?' on':'');
  c.textContent=label;c.onclick=()=>{state[group]=val;buildChips();render();};return c;}
function buildChips(){
  const k=$('kinds'),p=$('people'),so=$('sort');
  for(const el of [k,p,so]) while(el.children.length>1) el.removeChild(el.lastChild);
  const kc={}; for(const m of mems) kc[m.kind]=(kc[m.kind]||0)+1;
  k.appendChild(chip('kind','all',`all ${mems.length}`));
  for(const [kind,[ic,lbl]] of Object.entries(KINDS)) if(kc[kind]) k.appendChild(chip('kind',kind,`${ic} ${lbl} ${kc[kind]}`));
  for(const kind of Object.keys(kc)) if(!KINDS[kind]) k.appendChild(chip('kind',kind,`${kind} ${kc[kind]}`));
  const pc={}; for(const m of mems) for(const n of (m.people||[])) pc[n]=(pc[n]||0)+1;
  p.appendChild(chip('person','all','everyone'));
  for(const [n,c] of Object.entries(pc).sort((a,b)=>b[1]-a[1])) p.appendChild(chip('person',n,`${n} ${c}`));
  so.appendChild(chip('sort','new','newest first')); so.appendChild(chip('sort','imp','most important'));
}
function render(){
  const q=state.q.toLowerCase();
  let list=mems.filter(m=>(state.kind==='all'||m.kind===state.kind)&&(state.person==='all'||(m.people||[]).includes(state.person))
    &&(!q||m.text.toLowerCase().includes(q)||(m.feeling||'').toLowerCase().includes(q)));
  list.sort(state.sort==='imp'?(a,b)=>b.importance-a.importance||b.time-a.time:(a,b)=>b.time-a.time);
  const now=Date.now()/1000;
  $('list').innerHTML=list.map(m=>{
    const [ic]=KINDS[m.kind]||['•'];
    const imp=Array.from({length:10},(_,i)=>`<i class="${i<m.importance?'f':''}"></i>`).join('');
    const fade=m.kind==='observation'?`<span class="tag fade">fades in ${Math.max(0,Math.round((m.time+2*86400-now)/3600))} h</span>`:'';
    const pend=m.id>lastReflected&&m.kind!=='reflection'&&m.kind!=='dream'?'<span class="tag pending" title="not yet consolidated in his sleep">not yet dreamed over</span>':'';
    const isNew=!first&&!seen.has(m.id);
    return `<div class="mem ${esc(m.kind)}${isNew?' new':''}"><span class="ic">${ic}</span><span class="tx">${esc(m.text)}</span>
      <div class="meta"><span>${when(m.time)}</span><span class="imp" title="importance ${m.importance}/10">${imp}</span>
      ${(m.people||[]).map(n=>`<span class="who">${esc(n)}</span>`).join('')}${fade}${pend}
      ${m.feeling?`<span title="how he felt">felt: ${esc(m.feeling)}</span>`:''}</div></div>`;
  }).join('')||'<div class="empty">nothing matches</div>';
  for(const m of mems) seen.add(m.id); first=false;
}
async function load(){
  const [txt,self]=await Promise.all([fetch('memories.jsonl?t='+Date.now(),{cache:'no-store'}).then(r=>r.text()),
    fetch('self.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).catch(()=>({}))]);
  lastReflected=self.last_reflected_id||0;
  mems=txt.split('\n').filter(l=>l.trim()).map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean);
  const kc={}; for(const m of mems) kc[m.kind]=(kc[m.kind]||0)+1;
  $('counts').textContent=`${mems.length} memories · ${kc.reflection||0} insights · ${kc.dream||0} dreams`;
  const y=window.scrollY; buildChips(); render(); window.scrollTo(0,y);
}
$('q').addEventListener('input',e=>{state.q=e.target.value;render();});
const es=new EventSource('/events');
es.addEventListener('files',m=>{const f=JSON.parse(m.data); if('memories.jsonl' in f||'self.json' in f) load().catch(()=>{});});
load();
</script>
</body>
</html>
